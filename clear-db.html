<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>清除数据库</title>
</head>
<body>
  <h1>清除 IndexedDB 数据库</h1>
  <button id="clearBtn" style="padding: 10px 20px; font-size: 16px; background: #f44336; color: white; border: none; border-radius: 4px; cursor: pointer;">
    清除数据库
  </button>
  <div id="result" style="margin-top: 20px; padding: 10px; background: #f5f5f5; border-radius: 4px;"></div>
  
  <script>
    document.getElementById('clearBtn').addEventListener('click', async () => {
      const resultDiv = document.getElementById('result');
      resultDiv.textContent = '正在删除数据库...';
      
      try {
        const deleteRequest = indexedDB.deleteDatabase('readingLinks');
        
        deleteRequest.onsuccess = () => {
          resultDiv.textContent = '✅ 数据库删除成功！请关闭此页面，然后重新加载扩展。';
          resultDiv.style.color = 'green';
        };
        
        deleteRequest.onerror = () => {
          resultDiv.textContent = '❌ 删除失败: ' + deleteRequest.error;
          resultDiv.style.color = 'red';
        };
        
        deleteRequest.onblocked = () => {
          resultDiv.textContent = '⚠️ 删除被阻塞，请关闭所有扩展相关的标签页，然后重试。';
          resultDiv.style.color = 'orange';
        };
      } catch (error) {
        resultDiv.textContent = '❌ 错误: ' + error.message;
        resultDiv.style.color = 'red';
      }
    });
  </script>
</body>
</html>
